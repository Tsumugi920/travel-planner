<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行计划 Travel Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>🧳 旅行计划</h1>
      <p class="subtitle">行程安排 · 预算统计 · 打包清单，一站搞定</p>
    </div>
  </header>

  <main id="app">
    <!-- 行程列表视图 -->
    <section id="list-view">
      <div class="view-head">
        <h2>我的行程</h2>
        <button id="btn-new-trip" class="btn btn-primary">＋ 新建行程</button>
      </div>
      <div id="trip-grid" class="trip-grid"></div>
    </section>

    <!-- 行程详情视图 -->
    <section id="detail-view" hidden>
      <button id="btn-back" class="btn btn-ghost">← 返回列表</button>
      <div id="trip-header" class="trip-header"></div>

      <nav class="tabs">
        <button class="tab active" data-tab="schedule">📅 行程安排</button>
        <button class="tab" data-tab="budget">💰 预算统计</button>
        <button class="tab" data-tab="packing">🎒 打包清单</button>
      </nav>

      <!-- 按天安排景点与活动 -->
      <div id="panel-schedule" class="panel">
        <form id="schedule-form" class="card form-row">
          <label>第几天
            <select id="schedule-day" name="day"></select>
          </label>
          <label>时间
            <input type="time" name="time">
          </label>
          <label>类型
            <select name="type">
              <option>景点</option>
              <option>活动</option>
              <option>美食</option>
              <option>交通</option>
              <option>住宿</option>
              <option>购物</option>
              <option>其他</option>
            </select>
          </label>
          <label class="grow">标题 *
            <input name="title" required placeholder="例如：浅草寺 &amp; 仲见世商店街">
          </label>
          <label class="grow">备注
            <input name="note" placeholder="可选">
          </label>
          <button type="submit" class="btn btn-primary">＋ 添加安排</button>
        </form>
        <div id="schedule-list"></div>
      </div>

      <!-- 预算统计 -->
      <div id="panel-budget" class="panel" hidden>
        <div id="budget-summary" class="budget-summary"></div>
        <form id="budget-form" class="card form-row">
          <label>类别
            <select name="category">
              <option>交通</option>
              <option>住宿</option>
              <option>餐饮</option>
              <option>门票</option>
              <option>活动</option>
              <option>购物</option>
              <option>其他</option>
            </select>
          </label>
          <label>金额（元）*
            <input type="number" name="amount" min="0" step="0.01" required placeholder="0.00">
          </label>
          <label class="grow">备注
            <input name="note" placeholder="例如：往返机票">
          </label>
          <button type="submit" class="btn btn-primary">＋ 记一笔</button>
        </form>
        <div id="budget-list"></div>
      </div>

      <!-- 打包清单 -->
      <div id="panel-packing" class="panel" hidden>
        <div id="packing-progress"></div>
        <form id="packing-form" class="card form-row">
          <label class="grow">物品名称
            <input id="packing-name" name="name" required placeholder="例如：护照 / 充电宝">
          </label>
          <button type="submit" class="btn btn-primary">＋ 加入清单</button>
        </form>
        <div id="packing-list"></div>
      </div>
    </section>
  </main>

  <!-- 新建 / 编辑行程弹窗 -->
  <div id="trip-modal" class="modal-mask" hidden>
    <div class="modal">
      <h3 id="modal-title">新建行程</h3>
      <form id="trip-form">
        <label>行程名称 *
          <input name="name" required placeholder="例如：东京五日游">
        </label>
        <label>目的地
          <input name="destination" placeholder="例如：日本 · 东京">
        </label>
        <div class="form-grid">
          <label>开始日期
            <input type="date" name="startDate">
          </label>
          <label>结束日期
            <input type="date" name="endDate">
          </label>
        </div>
        <p id="trip-form-error" class="form-error" hidden></p>
        <div class="modal-actions">
          <button type="button" id="btn-cancel-trip" class="btn btn-ghost">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
